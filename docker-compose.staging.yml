name: kpi-system-staging

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${STAGING_POSTGRES_DB}
      POSTGRES_USER: ${STAGING_POSTGRES_USER}
      POSTGRES_PASSWORD: ${STAGING_POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data

  migrate:
    image: ${GHCR_IMAGE_PREFIX}/kpi-system-migrate:${IMAGE_TAG}
    profiles: [migration]
    environment:
      DATABASE_URL: postgresql://${STAGING_POSTGRES_USER}:${STAGING_POSTGRES_PASSWORD}@postgres:5432/${STAGING_POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    image: ${GHCR_IMAGE_PREFIX}/kpi-system-backend:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${STAGING_POSTGRES_USER}:${STAGING_POSTGRES_PASSWORD}@postgres:5432/${STAGING_POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${STAGING_BACKEND_PORT}:4000"

  frontend:
    image: ${GHCR_IMAGE_PREFIX}/kpi-system-frontend:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${STAGING_FRONTEND_PORT}:80"

volumes:
  staging_postgres_data:
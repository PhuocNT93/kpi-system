services:
  - type: web
    name: kpi-system-develop-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: development
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_ADDRESS
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_ALLOWED_DOMAIN
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_ADDRESS
        sync: false
      - key: SMTP_FROM_NAME
        value: Performance Evaluation System
      - key: SMTP_THROTTLE_PER_MINUTE
        value: 60
      - key: PORTAL_BASE_URL
        sync: false
      - key: JIRA_BASE_URL
        value: https://pim.cyberlogitec.com/jira
      - key: JIRA_USERNAME
        value: ky.luong
      - key: JIRA_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: BLUEPRINT_BASE_URL
        value: https://blueprint.cyberlogitec.com.vn
      - key: BLUEPRINT_USERNAME
        value: kyluong
      - key: BLUEPRINT_PASSWORD
        sync: false
name: Deploy Develop

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      run_migrations:
        description: Run Neon migrations on the develop database
        required: true
        default: false
        type: boolean
      run_seed:
        description: Seed the develop database
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: develop-deployment
  cancel-in-progress: false

jobs:
  validate-backend:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  validate-frontend:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  deploy-frontend:
    if: github.ref == 'refs/heads/develop' && inputs.run_migrations != true && inputs.run_seed != true
    needs: [validate-backend, validate-frontend]
    runs-on: ubuntu-latest
    environment: develop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - name: Deploy develop preview to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VITE_API_BASE_URL: ${{ secrets.DEVELOP_API_BASE_URL }}
        run: npx vercel@latest deploy --yes --token "$VERCEL_TOKEN"

  migrate-database:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop' && inputs.run_migrations == true
    needs: [validate-backend, validate-frontend]
    runs-on: ubuntu-latest
    environment: develop
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Validate Neon database URL
        env:
          DATABASE_URL: ${{ secrets.DEVELOP_DATABASE_URL }}
        run: |
          node --input-type=module <<'NODE'
          const databaseUrl = process.env.DATABASE_URL;
          if (!databaseUrl) {
            throw new Error('DEVELOP_DATABASE_URL is not configured in GitHub Environment develop.');
          }

          const parsedUrl = new URL(databaseUrl);
          const localHosts = new Set(['localhost', '127.0.0.1', '::1']);
          if (!['postgres:', 'postgresql:'].includes(parsedUrl.protocol)) {
            throw new Error('DEVELOP_DATABASE_URL must use postgres or postgresql protocol.');
          }
          if (localHosts.has(parsedUrl.hostname)) {
            throw new Error('DEVELOP_DATABASE_URL points to localhost. Use the Neon connection string.');
          }
          NODE
      - name: Run Neon develop migrations
        env:
          DATABASE_URL: ${{ secrets.DEVELOP_DATABASE_URL }}
        run: npm run migrate:up

  deploy-backend:
    if: github.ref == 'refs/heads/develop' && inputs.run_migrations != true && inputs.run_seed != true
    needs: [validate-backend, validate-frontend]
    runs-on: ubuntu-latest
    environment: develop
    steps:
      - name: Trigger Render develop deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"

  seed-database:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop' && inputs.run_seed == true
    needs: [validate-backend, validate-frontend]
    runs-on: ubuntu-latest
    environment: develop
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Validate Neon database URL
        env:
          DATABASE_URL: ${{ secrets.DEVELOP_DATABASE_URL }}
        run: |
          node --input-type=module <<'NODE'
          const databaseUrl = process.env.DATABASE_URL;
          if (!databaseUrl) {
            throw new Error('DEVELOP_DATABASE_URL is not configured in GitHub Environment develop.');
          }

          const parsedUrl = new URL(databaseUrl);
          const localHosts = new Set(['localhost', '127.0.0.1', '::1']);
          if (!['postgres:', 'postgresql:'].includes(parsedUrl.protocol)) {
            throw new Error('DEVELOP_DATABASE_URL must use postgres or postgresql protocol.');
          }
          if (localHosts.has(parsedUrl.hostname)) {
            throw new Error('DEVELOP_DATABASE_URL points to localhost. Use the Neon connection string.');
          }
          NODE
      - name: Seed Neon develop database
        env:
          DATABASE_URL: ${{ secrets.DEVELOP_DATABASE_URL }}
        run: npm run seed